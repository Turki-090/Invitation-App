name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dawah_test
          POSTGRES_USER: dawah_test
          POSTGRES_PASSWORD: dawah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawah_test -d dawah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DAWAH_ENV: test
      DATABASE_URL: postgresql://dawah_test:dawah_test@localhost:5432/dawah_test?schema=public
      REDIS_URL: redis://localhost:6379
      QUEUE_PREFIX: dawah:ci
      DAWAH_DEV_AUTH_BYPASS: "false"
      NEXT_PUBLIC_DAWAH_DEV_AUTH_BYPASS: "false"
      API_PORT: "4100"
      WORKER_PORT: "4101"
      API_CORS_ORIGINS: http://127.0.0.1:3100
      API_BODY_LIMIT_BYTES: "1048576"
      API_READY_TIMEOUT_MS: "3000"
      WORKER_READY_TIMEOUT_MS: "3000"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:lint
      - run: pnpm openapi:check
      - run: pnpm generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm artifacts:check
      - run: pnpm smoke
      - run: docker build -f apps/api/Dockerfile -t dawah-api:stage1 .
      - run: docker build -f apps/worker/Dockerfile -t dawah-worker:stage1 .
      - run: pnpm smoke:containers
