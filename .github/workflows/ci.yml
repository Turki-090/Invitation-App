name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
        env:
          DATABASE_URL: postgresql://dawah:dawah@localhost:5432/dawah?schema=public
      - run: pnpm format:check
      - run: pnpm openapi:lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
