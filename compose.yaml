services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dawah
      POSTGRES_USER: dawah
      POSTGRES_PASSWORD: dawah
    ports:
      - "5432:5432"
    volumes:
      - dawah-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawah -d dawah"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - dawah-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dawah-postgres:
  dawah-redis:
