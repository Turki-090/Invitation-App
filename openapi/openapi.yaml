openapi: 3.1.0
info:
  title: Dawah Platform API
  version: 1.0.0
  description: Versioned contract shared by the web application and future iOS and Android clients.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Current deployment
tags:
  - name: health
    description: Service health and readiness checks.
  - name: events
    description: Event lifecycle and event-scoped host access.
  - name: invitations
    description: Event-scoped invitation groups and named guest management.
  - name: imports
    description: Secure, reviewable bulk invitation imports.
  - name: assets
    description: Private event imagery and invitation assets.
  - name: templates
    description: Versioned invitation message templates.
  - name: preparation
    description: Invitation previews, readiness checks, and immutable content snapshots.
  - name: messaging
    description: Idempotent WhatsApp send batches, delivery progress, and safe resend review.
  - name: webhooks
    description: Authenticated provider callbacks processed asynchronously.
paths:
  /health/live:
    get:
      summary: Check API liveness
      tags: [health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /health/ready:
    get:
      summary: Check API dependency readiness
      tags: [health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: PostgreSQL and Redis are available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /events:
    get:
      summary: List accessible events
      tags: [events]
      operationId: listEvents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Non-archived events available through active event memberships.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Create an event
      tags: [events]
      operationId: createEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvent" }
      responses:
        "201":
          description: Event and owner membership created atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get an accessible event
      tags: [events]
      operationId: getEvent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Full event settings for an active event member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      summary: Update event settings
      tags: [events]
      operationId: updateEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEvent" }
      responses:
        "200":
          description: Updated event settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/archive:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Archive an event
      tags: [events]
      operationId: archiveEvent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Event archived without deleting its operational history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/recovery-request:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Recover an archived event
      description: Restores the status captured by the latest archive audit record, or DRAFT when legacy audit metadata is unavailable.
      tags: [events]
      operationId: recoverEvent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Event recovered and returned to its pre-archive lifecycle status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/status-transitions:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Transition an event lifecycle status
      tags: [events]
      operationId: transitionEventStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionEventStatus" }
      responses:
        "200":
          description: Event transitioned according to the lifecycle policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get server-computed event dashboard aggregates
      tags: [events]
      operationId: getEventDashboard
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Counts exclude cancelled invitation groups and remain explicit by business unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/invitations:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List invitation groups
      description: Returns page-based results and explicit invitation-group, named-guest, and expected-attendee totals.
      tags: [invitations]
      operationId: listInvitations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: invitationType
          in: query
          schema: { $ref: "#/components/schemas/InvitationType" }
        - name: rsvpStatus
          in: query
          schema: { $ref: "#/components/schemas/RsvpStatus" }
        - name: cancellationStatus
          in: query
          schema:
            type: string
            enum: [ACTIVE, CANCELLED, ALL]
            default: ACTIVE
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [DISPLAY_NAME, CREATED_AT, UPDATED_AT, EXPECTED_ATTENDEES]
            default: CREATED_AT
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          description: A filtered and sorted page of accessible invitation groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Create an invitation group
      description: Normalizes the contact phone and atomically persists a domain-valid invitation aggregate.
      tags: [invitations]
      operationId: createInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitation" }
      responses:
        "201":
          description: Invitation group and named members created atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The event is not writable, or an active invitation uses the normalized phone and explicit override was not supplied.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/InvitationMutationConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/invitations/bulk-cancel:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Cancel selected invitation groups
      description: Soft-cancels up to 100 event-owned invitations while preserving operational history.
      tags: [invitations]
      operationId: bulkCancelInvitations
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkCancelInvitations" }
      responses:
        "200":
          description: Cancellation result including already-cancelled selections.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/BulkCancelInvitationsResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/InvitationId"
    get:
      summary: Get an invitation group
      tags: [invitations]
      operationId: getInvitation
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Invitation detail with ordered named members and permission-shaped phone fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      summary: Update an invitation group
      description: Applies a partial edit and validates the merged aggregate inside the transaction.
      tags: [invitations]
      operationId: updateInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvitation" }
      responses:
        "200":
          description: Updated invitation aggregate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The event or invitation is not writable, an RSVP locks structural edits, or a phone duplicate requires explicit override.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/InvitationMutationConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/invitations/{invitationId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      summary: Cancel an invitation group
      description: Soft-cancels one event-owned invitation while retaining its members, RSVP data, and audit history.
      tags: [invitations]
      operationId: cancelInvitation
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cancelled invitation detail, or the unchanged detail when it was already cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/limits:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Get guest import limits
      description: Returns the server-enforced file and parser limits before a host uploads a source file.
      tags: [imports]
      operationId: getImportLimits
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current import limits and accepted source formats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLimits" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List guest import jobs
      tags: [imports]
      operationId: listImportJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ImportJobStatus" }
      responses:
        "200":
          description: A page of import jobs for the event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListImportJobsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Upload a guest import source
      description: Validates the source envelope, stores it privately, creates an import job, and queues bounded parsing.
      tags: [imports]
      operationId: uploadImportSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A UTF-8 CSV or hardened XLSX source file.
      responses:
        "201":
          description: Import job created and queued for parsing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/{importJobId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ImportJobId"
    get:
      summary: Get an import job and review rows
      tags: [imports]
      operationId: getImportJob
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: rowStatus
          in: query
          schema: { $ref: "#/components/schemas/ImportRowStatus" }
      responses:
        "200":
          description: Import state, mappings, validation totals, and a page of review rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobDetailResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/{importJobId}/mapping:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ImportJobId"
    patch:
      summary: Map import columns and queue validation
      description: Saves a one-to-one source-column mapping under optimistic concurrency and revalidates every row asynchronously.
      tags: [imports]
      operationId: updateImportMapping
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImportMapping" }
      responses:
        "200":
          description: Updated import job summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/{importJobId}/rows/{rowId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ImportJobId"
      - $ref: "#/components/parameters/ImportRowId"
    patch:
      summary: Correct an import row
      description: Applies explicit corrections, preserves the source row, and revalidates under optimistic job concurrency.
      tags: [imports]
      operationId: updateImportRow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateImportRow" }
      responses:
        "200":
          description: Updated import job summary after row revalidation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/{importJobId}/confirm:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ImportJobId"
    post:
      summary: Confirm a reviewed guest import
      description: Atomically creates all accepted invitation groups after an explicit duplicate decision.
      tags: [imports]
      operationId: confirmImport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmImport" }
      responses:
        "200":
          description: Completed import result; repeated confirmation returns the same committed result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmImportResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/imports/{importJobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ImportJobId"
    post:
      summary: Cancel a guest import
      description: Cancels a non-completed import while preserving its file, rows, and audit history.
      tags: [imports]
      operationId: cancelImport
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cancelled import job, or the unchanged job when it was already cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/assets:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List private event assets
      tags: [assets]
      operationId: listAssets
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AssetKind" }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Event-owned assets filtered by kind and archive state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListAssetsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Upload a private event asset
      description: Verifies the image signature, dimensions, decompression bounds, and checksum before private storage.
      tags: [assets]
      operationId: uploadAsset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AssetUpload" }
      responses:
        "201":
          description: Validated private asset metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredAsset" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/assets/{assetId}/content:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/AssetId"
    get:
      summary: Download private asset content
      description: Streams authorized event-owned image bytes with private, no-store caching.
      tags: [assets]
      operationId: getAssetContent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Original validated image bytes.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            Content-Length:
              schema: { type: integer, minimum: 1 }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/assets/{assetId}/archive:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/AssetId"
    post:
      summary: Archive a private asset
      description: Archives an unused asset without deleting its immutable storage record.
      tags: [assets]
      operationId: archiveAsset
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Archived asset, or the unchanged asset when it was already archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/templates:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List invitation templates
      tags: [templates]
      operationId: listInvitationTemplates
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every versioned template owned by the event.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ListInvitationTemplatesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Create an invitation template
      description: Creates the first immutable version of a locale-specific invitation template.
      tags: [templates]
      operationId: createInvitationTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationTemplate" }
      responses:
        "201":
          description: Draft invitation template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationTemplate" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TemplateId"
    patch:
      summary: Create a new invitation template version
      description: Applies an optimistic edit by creating a new immutable draft version and retaining prior versions.
      tags: [templates]
      operationId: updateInvitationTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvitationTemplate" }
      responses:
        "200":
          description: Newly created draft template version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationTemplate" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/templates/{templateId}/approve:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TemplateId"
    post:
      summary: Approve an invitation template version
      tags: [templates]
      operationId: approveInvitationTemplate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveInvitationTemplate" }
      responses:
        "200":
          description: Approved template version ready for snapshot preparation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationTemplate" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/templates/{templateId}/archive:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/TemplateId"
    post:
      summary: Archive an invitation template version
      tags: [templates]
      operationId: archiveInvitationTemplate
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Archived template, or the unchanged template when it was already archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/preparation/preview:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Preview invitation content
      description: Renders the server-authoritative message, scope text, and reply actions without sending it.
      tags: [preparation]
      operationId: previewInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationPreviewRequest" }
      responses:
        "200":
          description: Server-rendered invitation preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/preparation/readiness:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: Compute invitation readiness
      description: Computes every invitation's blocking issues and snapshot freshness against an approved template.
      tags: [preparation]
      operationId: getInvitationReadiness
      security: [{ bearerAuth: [] }]
      parameters:
        - name: templateId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Server-computed readiness summary and invitation page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/preparation/snapshots:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Prepare immutable invitation snapshots
      description: Atomically creates or reuses reproducible content snapshots for all invitations or an explicit bounded selection.
      tags: [preparation]
      operationId: createInvitationSnapshots
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePreparationSnapshots" }
      responses:
        "201":
          description: Snapshot preparation result, including invitations blocked by readiness issues.
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CreatePreparationSnapshotsResult",
                }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/sending/readiness:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Review invitation send readiness
      description: Produces a short-lived server confirmation over current immutable snapshots, prior sends, and the credit-unit estimate.
      tags: [messaging]
      operationId: reviewSendReadiness
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendReadinessRequest" }
      responses:
        "200":
          description: Current server-authoritative send summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendReadinessResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/send-batches:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      summary: List WhatsApp send batches
      tags: [messaging]
      operationId: listSendBatches
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paged send batches with derived delivery progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSendBatchesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Confirm and queue an invitation send batch
      description: Revalidates the short-lived confirmation in a transaction, persists one immutable logical message per ready invitation, and returns before provider delivery.
      tags: [messaging]
      operationId: createSendBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSendBatch" }
      responses:
        "202":
          description: Durable send batch accepted for asynchronous dispatch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendBatch" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /events/{eventId}/send-batches/{batchId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SendBatchId"
    get:
      summary: Get send-batch progress and messages
      tags: [messaging]
      operationId: getSendBatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MessageStatus" }
      responses:
        "200":
          description: Batch totals and a page of recipient-safe message summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendBatchDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/messages/{messageId}/resend-readiness:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/MessageId"
    post:
      summary: Review a failed message for safe resend
      tags: [messaging]
      operationId: reviewMessageResend
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current resend eligibility and short-lived confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResendReadinessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events/{eventId}/messages/{messageId}/resend:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/MessageId"
    post:
      summary: Confirm and queue a safe message resend
      tags: [messaging]
      operationId: resendMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendMessage" }
      responses:
        "202":
          description: Immutable resend accepted as a new logical message and credit unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendBatch" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /messaging/media/{snapshotId}:
    get:
      summary: Resolve a short-lived invitation image capability for WhatsApp
      description: Serves checksum-verified bytes from private storage only when the expiry-bounded HMAC capability matches the immutable invitation snapshot.
      tags: [messaging]
      operationId: getWhatsappMessageMedia
      security: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: checksum
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - name: expires
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1000000000 }
        - name: signature
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Checksum-verified invitation image bytes.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /webhooks/whatsapp:
    get:
      summary: Complete the Meta webhook verification challenge
      tags: [webhooks]
      operationId: verifyWhatsappWebhook
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: { type: string, const: subscribe }
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exact challenge value as plain text.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Authenticate and persist Meta WhatsApp webhook events
      tags: [webhooks]
      operationId: receiveWhatsappWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[a-fA-F0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Authenticated events durably persisted and queued for asynchronous reduction.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/WhatsappWebhookAcknowledgement" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Event UUID.
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation-group UUID.
      schema: { type: string, format: uuid }
    ImportJobId:
      name: importJobId
      in: path
      required: true
      description: Guest import-job UUID.
      schema: { type: string, format: uuid }
    ImportRowId:
      name: rowId
      in: path
      required: true
      description: Import-row UUID.
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      description: Private stored-asset UUID.
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      description: Invitation-template version UUID.
      schema: { type: string, format: uuid }
    SendBatchId:
      name: batchId
      in: path
      required: true
      description: Send-batch UUID.
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      description: Logical-message UUID.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated visible ASCII key unique to this logical mutation.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: "^[!-~]+$"
  responses:
    Unauthorized:
      description: Missing, invalid, or expired host token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: The active event membership lacks the required capability.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: The event does not exist or is not accessible to this principal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: The operation conflicts with the current event lifecycle state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLarge:
      description: The uploaded source exceeds the configured byte limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ServiceUnavailable:
      description: A required service dependency is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, const: ok }
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database: { type: string, const: ok }
            redis: { type: string, const: ok }
    EventType:
      type: string
      enum: [WEDDING, ENGAGEMENT, RECEPTION, GRADUATION, PRIVATE_EVENT, OTHER]
    EventStatus:
      type: string
      enum:
        [DRAFT, ACTIVE, RSVP_OPEN, RSVP_CLOSED, EVENT_DAY, COMPLETED, ARCHIVED]
    MembershipRole:
      type: string
      enum: [OWNER, CO_HOST, CHECK_IN_STAFF]
    CreateEvent:
      type: object
      additionalProperties: false
      required:
        [
          nameAr,
          eventType,
          eventDate,
          startTime,
          timezone,
          venueNameAr,
          city,
          allowRsvpEdits,
          qrEnabled,
        ]
      properties:
        nameAr: { type: string, minLength: 2, maxLength: 120 }
        nameEn: { type: string, minLength: 2, maxLength: 120 }
        eventType: { $ref: "#/components/schemas/EventType" }
        eventDate: { type: string, format: date }
        startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        timezone:
          type: string
          maxLength: 80
          example: Asia/Riyadh
          description: Valid IANA time-zone identifier.
        venueNameAr: { type: string, minLength: 2, maxLength: 160 }
        venueNameEn: { type: string, minLength: 2, maxLength: 160 }
        city: { type: string, minLength: 2, maxLength: 80 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        mapUrl:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS Google Maps or Apple Maps URL.
        rsvpDeadline: { type: string, format: date }
        allowRsvpEdits: { type: boolean, default: true }
        qrEnabled: { type: boolean, default: false }
    UpdateEvent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nameAr: { type: string, minLength: 2, maxLength: 120 }
        nameEn: { type: [string, "null"], minLength: 2, maxLength: 120 }
        eventType: { $ref: "#/components/schemas/EventType" }
        eventDate: { type: string, format: date }
        startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        endTime:
          type: [string, "null"]
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        timezone:
          type: string
          maxLength: 80
          description: Valid IANA time-zone identifier.
        venueNameAr: { type: string, minLength: 2, maxLength: 160 }
        venueNameEn: { type: [string, "null"], minLength: 2, maxLength: 160 }
