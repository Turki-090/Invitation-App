      type: object
      additionalProperties: false
      required: [batch, messages, pagination]
      properties:
        batch: { $ref: "#/components/schemas/SendBatch" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MessageSummary" }
        pagination:
          type: object
          additionalProperties: false
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            pageSize: { type: integer, minimum: 1, maximum: 100 }
            totalItems: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    ResendReadinessResponse:
      type: object
      additionalProperties: false
      required:
        [
          messageId,
          invitationGroupId,
          eligible,
          estimatedCreditUnits,
          confirmationToken,
          expiresAt,
          reasonCode,
          reason,
        ]
      properties:
        messageId: { type: string, format: uuid }
        invitationGroupId: { type: string, format: uuid }
        eligible: { type: boolean }
        estimatedCreditUnits: { type: integer, minimum: 0, maximum: 1 }
        confirmationToken: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        expiresAt: { type: [string, "null"], format: date-time }
        reasonCode:
          type: [string, "null"]
          enum:
            [
              NOT_FAILED,
              AMBIGUOUS_OUTCOME,
              ALREADY_RESENT,
              TEMPLATE_NOT_APPROVED,
              SNAPSHOT_STALE,
              null,
            ]
          description: Stable machine-readable reason when the resend is ineligible; null when eligible.
        reason: { type: [string, "null"] }
    ResendMessage:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken: { type: string, pattern: "^[a-f0-9]{64}$" }
    WhatsappWebhookAcknowledgement:
      type: object
      additionalProperties: false
      required: [accepted, queuedEvents, duplicateEvents]
      properties:
        accepted: { type: boolean, const: true }
        queuedEvents: { type: integer, minimum: 0 }
        duplicateEvents: { type: integer, minimum: 0 }
