          maskedPhone,
          status,
          locale,
          providerMessageId,
          attemptCount,
          failureClass,
          failureCode,
          failureReason,
          canResend,
          queuedAt,
          sentAt,
          deliveredAt,
          readAt,
          failedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        invitationGroupId: { type: string, format: uuid }
        invitationDisplayName: { type: string }
        maskedPhone: { type: string }
        status: { $ref: "#/components/schemas/MessageStatus" }
        locale: { $ref: "#/components/schemas/PreparationLocale" }
        providerMessageId: { type: [string, "null"] }
        attemptCount: { type: integer, minimum: 0 }
        failureClass:
          anyOf:
            - $ref: "#/components/schemas/MessagingFailureClass"
            - type: "null"
        failureCode: { type: [string, "null"] }
        failureReason: { type: [string, "null"] }
        canResend: { type: boolean }
        queuedAt: { type: string, format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        failedAt: { type: [string, "null"], format: date-time }
