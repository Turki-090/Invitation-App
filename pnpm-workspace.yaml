packages:
  - apps/*
  - packages/*

confirmModulesPurge: false
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

# Transitive advisories closed by the Stage 10 dependency review. Each entry is
# a security fix that the direct dependency has not yet released, so it is
# pinned here rather than waited on. Remove an entry once the parent package
# ships a version that resolves the advisory on its own.
overrides:
  # GHSA-535w-7cp7-47q4 and related: @nestjs/platform-express resolves 2.2.0,
  # which is the version that handles every upload the API accepts.
  multer: "2.3.0"
  # Code injection through _.template; reached via @nestjs/config.
  lodash: "^4.17.24"
  # Unbounded CPU on merge keys; reached through the OpenAPI linter.
  js-yaml: "^4.3.2"
  # Stack exhaustion on recursive graphs; reached through the Prisma CLI config.
  deepmerge-ts: "^8.0.0"
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p: stack exhaustion on nested
  # brace groups; reached through minimatch in the worker's spreadsheet
  # dependencies and the OpenAPI tooling. One pin per major line in use.
  "brace-expansion@<1.1.20": "1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.6"
  "brace-expansion@>=5.0.0 <5.0.11": "5.0.11"

minimumReleaseAgeExclude:
  - "@redocly/cli@2.51.2"
